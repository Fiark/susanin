# Susanin v0.12.0 non-secret runtime configuration.
#
# Normally created and maintained by:
#
#   susanin setup
#   susanin target set ...
#   susanin config set ...
#
# Manual editing is usually unnecessary.
#
# The RouterOS API machine password is NOT stored here.

# RouterOS LAN interface-list used by Susanin.
lan_list=LAN

# Routing target.
#
# Supported modes:
#
#   interface
#   routing-table
#
# Examples only:
#
# target_mode=interface
# target_value=wg-vpn
#
# target_mode=routing-table
# target_value=r_to_awg

# Resolved compatibility/runtime fields.
#
# Susanin writes these when required by the selected target.
# Do not invent values only to satisfy the configuration file.
#
# egress_interface=wg-vpn
# routing_table=r_to_awg

# Adaptive accuracy profile.
#
# Supported:
#   fast
#   middle
#   slow
#
# Default:
accuracy_profile=fast

# RouterOS decision logging.
#
# Supported:
#   quiet
#   error
#   info
#   debug
#   trace
#
# In v0.12.0 generated RouterOS decision logging for trace is effectively
# equivalent to debug.
#
# Default:
log_level=info

# Internal diagnostic recorder.
#
# Supported:
#   on
#   off
#
# Default:
diagnostics=off

# Diagnostic NDJSON rotation.
#
# Supported ranges:
#   diagnostic_max_size_mb = 1..100
#   diagnostic_max_files   = 1..10
#
# Defaults:
diagnostic_max_size_mb=10
diagnostic_max_files=3

# RouterOS API endpoint.
#
# Normally inferred from the isolated Susanin controller network.
# Override only when intentionally using a different endpoint.
#
# router_host=172.31.254.1
# router_port=8728
