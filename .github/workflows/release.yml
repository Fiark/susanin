name: Verify frozen release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify'
        required: true
        default: 'v0.12.0'
        type: string
      artifact_source_sha:
        description: 'Commit from which the frozen runtime artifact was built'
        required: true
        default: 'd53517dfd6daccb7073517661138d79c573cac46'
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify frozen release source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.artifact_source_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "ERROR: invalid release tag: $TAG"
            exit 1
          fi

          git rev-parse --verify "${TAG}^{commit}" >/dev/null
          git rev-parse --verify "${SOURCE_SHA}^{commit}" >/dev/null

          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          SOURCE_COMMIT="$(git rev-parse "${SOURCE_SHA}^{commit}")"

          echo "Release tag         : $TAG"
          echo "Release tag commit  : $TAG_COMMIT"
          echo "Artifact source SHA : $SOURCE_COMMIT"

          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" "$TAG_COMMIT"; then
            echo "ERROR: artifact source is not an ancestor of the release tag."
            exit 1
          fi

          echo
          echo "Checking frozen runtime/build inputs..."

          PROTECTED_PATHS=(
            .dockerignore
            Dockerfile
            Makefile
            src
            templates
            bootstrap
          )

          if ! git diff --quiet \
            "$SOURCE_COMMIT" \
            "$TAG_COMMIT" \
            -- "${PROTECTED_PATHS[@]}"; then

            echo "ERROR: frozen runtime/build inputs changed after artifact build."
            echo
            git diff --name-status \
              "$SOURCE_COMMIT" \
              "$TAG_COMMIT" \
              -- "${PROTECTED_PATHS[@]}"
            exit 1
          fi

          echo "PASS: frozen runtime/build inputs are unchanged."

      - name: Verify release version plumbing
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          SOURCE_VERSION="$(
            sed -nE 's/^#define SUSANIN_VERSION "([^"]+)"$/\1/p' src/version.h
          )"

          BOOTSTRAP_HEADER_VERSION="$(
            sed -nE 's/^# Susanin v([^ ]+) credentialless bootstrap$/\1/p' bootstrap/install.rsc
          )"

          BOOTSTRAP_TAG_VERSION="$(
            sed -nE 's/.*\$susaninBootstrapTag != "([^"]+)".*/\1/p' bootstrap/install.rsc
          )"

          ROOT_TOKEN="$(
            printf '%s' "$VERSION" | tr -cd '[:alnum:]'
          )"

          EXPECTED_ROOT="/susanin-controller-v${ROOT_TOKEN}"

          BOOTSTRAP_ROOTS="$(
            grep -oE '/susanin-controller-v[[:alnum:]]+' bootstrap/install.rsc \
              | sort -u || true
          )"

          ROOT_COUNT="$(
            printf '%s\n' "$BOOTSTRAP_ROOTS" \
              | sed '/^$/d' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Release version          : $VERSION"
          echo "Source version           : $SOURCE_VERSION"
          echo "Bootstrap header version : $BOOTSTRAP_HEADER_VERSION"
          echo "Bootstrap expected tag   : $BOOTSTRAP_TAG_VERSION"
          echo "Expected root-dir        : $EXPECTED_ROOT"
          echo "Bootstrap root-dir(s)    :"
          printf '%s\n' "$BOOTSTRAP_ROOTS"

          test "$SOURCE_VERSION" = "$VERSION"
          test "$BOOTSTRAP_HEADER_VERSION" = "$VERSION"
          test "$BOOTSTRAP_TAG_VERSION" = "$VERSION"
          test "$ROOT_COUNT" = "1"
          test "$BOOTSTRAP_ROOTS" = "$EXPECTED_ROOT"

          if grep -nE ':return([;}[:space:]]|$)' bootstrap/install.rsc; then
            echo "ERROR: bare :return found in bootstrap/install.rsc"
            exit 1
          fi

          NOTES_FILE="docs/RELEASE_NOTES_v${VERSION}.md"

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "ERROR: release notes missing: $NOTES_FILE"
            exit 1
          fi

          echo "PASS: release version plumbing is consistent."

      - name: Verify v0.12.0 frozen identity
        if: ${{ inputs.tag == 'v0.12.0' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.artifact_source_sha }}
        run: |
          set -euo pipefail

          EXPECTED_SOURCE_SHA="d53517dfd6daccb7073517661138d79c573cac46"

          EXPECTED_TAR_SIZE="4199936"
          EXPECTED_TAR_SHA256="81f982953e3b4d75c343b7729685938d7fc21105ea2df2393ca49117e0aadb2f"

          EXPECTED_INSTALL_SHA256="192104fc8012958dc511f2f5e7db5ff58be9b7727a287fcfae5e2854407be1c0"
          EXPECTED_UNINSTALL_SHA256="6067daacdfb7a047aa4791d2d7d46796dc3a26102c6d9e1e1b1da2f5f40bec98"
          EXPECTED_UNINSTALL_CONTROLLER_SHA256="c5b6751f7d0907cc5db2e904ee32832e92446adfff3e9f9b64d2343ba522d4d3"

          SOURCE_COMMIT="$(git rev-parse "${SOURCE_SHA}^{commit}")"

          if [[ "$SOURCE_COMMIT" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "ERROR: v0.12.0 artifact source SHA mismatch."
            exit 1
          fi

          echo "${EXPECTED_INSTALL_SHA256}  bootstrap/install.rsc" \
            | sha256sum -c -

          echo "${EXPECTED_UNINSTALL_SHA256}  bootstrap/uninstall.rsc" \
            | sha256sum -c -

          echo "${EXPECTED_UNINSTALL_CONTROLLER_SHA256}  bootstrap/uninstall-controller.rsc" \
            | sha256sum -c -

          echo
          echo "Frozen v0.12.0 runtime identity:"
          echo "  artifact source : $EXPECTED_SOURCE_SHA"
          echo "  susanin.tar size: $EXPECTED_TAR_SIZE bytes"
          echo "  susanin.tar SHA : $EXPECTED_TAR_SHA256"
          echo
          echo "PASS: repository-side v0.12.0 frozen identity verified."
          echo "NOTE: susanin.tar itself is NOT rebuilt by this workflow."

      - name: Verification summary
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.artifact_source_sha }}
        run: |
          {
            echo "## Frozen release verification"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Artifact source: \`$SOURCE_SHA\`"
            echo "- Runtime/build inputs unchanged: PASS"
            echo "- Version plumbing: PASS"
            echo "- Artifact rebuild performed: NO"
            echo "- Release publication performed: NO"
          } >> "$GITHUB_STEP_SUMMARY"
