name: Release ARM64 artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (example: v0.12.0-rc1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release version plumbing
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "ERROR: invalid release tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"

          SOURCE_VERSION="$(
            sed -nE 's/^#define SUSANIN_VERSION "([^"]+)"$/\1/p' src/version.h
          )"

          BOOTSTRAP_HEADER_VERSION="$(
            sed -nE 's/^# Susanin v([^ ]+) credentialless bootstrap$/\1/p' bootstrap/install.rsc
          )"

          BOOTSTRAP_TAG_VERSION="$(
            sed -nE 's/.*\$susaninBootstrapTag != "([^"]+)".*/\1/p' bootstrap/install.rsc
          )"

          ROOT_TOKEN="$(
            printf '%s' "$VERSION" | tr -cd '[:alnum:]'
          )"

          EXPECTED_ROOT="/susanin-controller-v${ROOT_TOKEN}"

          BOOTSTRAP_ROOTS="$(
            grep -oE '/susanin-controller-v[[:alnum:]]+' bootstrap/install.rsc \
              | sort -u || true
          )"

          ROOT_COUNT="$(
            printf '%s\n' "$BOOTSTRAP_ROOTS" \
              | sed '/^$/d' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Release tag              : $TAG"
          echo "Release version          : $VERSION"
          echo "Source version           : $SOURCE_VERSION"
          echo "Bootstrap header version : $BOOTSTRAP_HEADER_VERSION"
          echo "Bootstrap expected tag   : $BOOTSTRAP_TAG_VERSION"
          echo "Expected root-dir        : $EXPECTED_ROOT"
          echo "Bootstrap root-dir(s)    :"
          printf '%s\n' "$BOOTSTRAP_ROOTS"

          test "$SOURCE_VERSION" = "$VERSION"
          test "$BOOTSTRAP_HEADER_VERSION" = "$VERSION"
          test "$BOOTSTRAP_TAG_VERSION" = "$VERSION"
          test "$ROOT_COUNT" = "1"
          test "$BOOTSTRAP_ROOTS" = "$EXPECTED_ROOT"

          if grep -nE ':return([;}[:space:]]|$)' bootstrap/install.rsc; then
            echo "ERROR: bare :return found in bootstrap/install.rsc"
            exit 1
          fi

          echo "PASS: release version plumbing is consistent"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build RouterOS ARM64 image
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail

          VERSION="${TAG#v}"

          rm -rf dist
          mkdir -p dist

          docker buildx build \
            --platform linux/arm64 \
            --no-cache \
            -t "susanin:${VERSION}" \
            --output type=docker,dest=dist/susanin.tar \
            .

          cp bootstrap/install.rsc dist/install.rsc
          cp bootstrap/uninstall.rsc dist/uninstall.rsc
          cp bootstrap/uninstall-controller.rsc dist/uninstall-controller.rsc

          (
            cd dist
            sha256sum \
              susanin.tar \
              install.rsc \
              uninstall.rsc \
              uninstall-controller.rsc \
              > SHA256SUMS
          )

      - name: Validate exact ARM64 release image
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          docker load -i dist/susanin.tar

          PLATFORM="$(
            docker image inspect "susanin:${VERSION}" \
              --format '{{.Os}}/{{.Architecture}}'
          )"

          echo "Image platform: $PLATFORM"

          if [[ "$PLATFORM" != "linux/arm64" ]]; then
            echo "ERROR: release image is not linux/arm64"
            exit 1
          fi

          VERSION_OUTPUT="$(
            docker run \
              --rm \
              --platform linux/arm64 \
              "susanin:${VERSION}" \
              version
          )"

          echo "Binary output: $VERSION_OUTPUT"

          if [[ "$VERSION_OUTPUT" != "Susanin ${VERSION}" ]]; then
            echo "ERROR: binary version mismatch"
            exit 1
          fi

          (
            cd dist
            sha256sum -c SHA256SUMS
          )

          echo "PASS: exact release image validated"

      - name: Create draft, attach assets, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          NOTES_FILE="docs/RELEASE_NOTES_v${VERSION}.md"

          if [[ "$VERSION" == *-* ]]; then
            RELEASE_KIND="prerelease"
            TITLE="$TAG — prerelease"
          else
            RELEASE_KIND="stable"
            TITLE="$TAG"
          fi

          echo "Release kind: $RELEASE_KIND"
          echo "Release title: $TITLE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(
              gh release view "$TAG" \
                --json isDraft \
                --jq '.isDraft'
            )"

            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "ERROR: published release already exists."
              echo "Refusing to replace or clobber published release assets."
              exit 1
            fi

            echo "Existing DRAFT release found; safe to resume asset upload."
          else
            if [[ -f "$NOTES_FILE" ]]; then
              if [[ "$RELEASE_KIND" == "prerelease" ]]; then
                gh release create "$TAG" \
                  --title "$TITLE" \
                  --notes-file "$NOTES_FILE" \
                  --draft \
                  --prerelease
              else
                gh release create "$TAG" \
                  --title "$TITLE" \
                  --notes-file "$NOTES_FILE" \
                  --draft
              fi
            else
              if [[ "$RELEASE_KIND" == "prerelease" ]]; then
                gh release create "$TAG" \
                  --title "$TITLE" \
                  --generate-notes \
                  --draft \
                  --prerelease
              else
                gh release create "$TAG" \
                  --title "$TITLE" \
                  --generate-notes \
                  --draft
              fi
            fi
          fi

          # --clobber is allowed only while the release is still a draft.
          gh release upload "$TAG" dist/* --clobber

          if [[ "$RELEASE_KIND" == "stable" ]]; then
            gh release edit "$TAG" \
              --draft=false \
              --latest
          else
            gh release edit "$TAG" \
              --draft=false
          fi

          echo "PASS: release published after all assets were attached"
