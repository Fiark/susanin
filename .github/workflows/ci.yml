name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build C11 with strict warnings
        run: |
          make clean
          make CFLAGS='-O2 -pipe -std=c11 -Wall -Wextra -Wpedantic -Werror'
          ./susanin version

      - name: v0.12 control-plane regression guard
        run: |
          chmod +x tools/v012-control-plane-check.sh
          ./tools/v012-control-plane-check.sh

      - name: Secret hygiene scan
        run: |
          chmod +x tools/secret-scan.sh
          ./tools/secret-scan.sh .

      - name: Dockerfile smoke build
        run: |
          docker build --no-cache -t susanin:ci .

  arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build and execute ARM64 image
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            sed -nE 's/^#define SUSANIN_VERSION "([^"]+)"$/\1/p' src/version.h
          )"

          rm -rf dist-ci
          mkdir -p dist-ci

          docker buildx build \
            --platform linux/arm64 \
            --no-cache \
            -t "susanin:ci-arm64" \
            --output type=docker,dest=dist-ci/susanin-arm64.tar \
            .

          docker load -i dist-ci/susanin-arm64.tar

          PLATFORM="$(
            docker image inspect susanin:ci-arm64 \
              --format '{{.Os}}/{{.Architecture}}'
          )"

          test "$PLATFORM" = "linux/arm64"

          OUTPUT="$(
            docker run \
              --rm \
              --platform linux/arm64 \
              susanin:ci-arm64 \
              version
          )"

          echo "$OUTPUT"

          test "$OUTPUT" = "Susanin $VERSION"

          echo "PASS: ARM64 runtime smoke test"
