name: "Runtime bug / Ошибка во время работы"
description: "Susanin is running, but runtime behavior is incorrect"
title: "[bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Runtime bug

        Use this form when `susanin-controller` is RUNNING and Susanin commands are available.

        Before filing the issue:

        1. `susanin diag start`
        2. reproduce the problem
        3. `susanin diag sample`
        4. `susanin diag errors`
        5. `susanin status`
        6. `susanin apply --dry-run`
        7. `susanin diag stop`

        [Logging and diagnostic capture guide](https://github.com/Fiark/susanin/blob/main/docs/LOGGING.md)

        If the container/bootstrap never starts, use the **Install / bootstrap problem** form instead.

        Never attach RouterOS backups, `show-sensitive` exports, VPN private keys, passwords or `susanin-secrets/routeros_password`.

  - type: checkboxes
    id: diagnostics
    attributes:
      label: Diagnostic capture
      options:
        - label: I enabled Susanin diagnostics before reproducing the problem and ran `diag sample` and `diag errors` afterwards.
          required: true
        - label: I reviewed/sanitized all attached logs and removed secrets, private keys and passwords.
          required: true

  - type: input
    id: version
    attributes:
      label: Susanin version
      placeholder: "0.11.5"
    validations:
      required: true

  - type: input
    id: routeros
    attributes:
      label: RouterOS version
      placeholder: "7.23.3"
    validations:
      required: true

  - type: input
    id: arch
    attributes:
      label: Architecture / device family
      description: Do not include serial number.
      placeholder: "ARM64 / hAP ax3"
    validations:
      required: true

  - type: textarea
    id: topology
    attributes:
      label: Network / tunnel topology
      description: LAN list, tunnel type, routing table. Do not include credentials.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include approximate problem time.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: susanin status
      render: text
    validations:
      required: true

  - type: textarea
    id: dryrun
    attributes:
      label: susanin apply --dry-run
      render: text
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: susanin diag sample
      render: text
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: susanin diag errors
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized AUTO-AWG / diagnostic logs
      description: Paste relevant lines or attach sanitized NDJSON.
    validations:
      required: true
